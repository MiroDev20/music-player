<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="420" height="760" viewBox="0 0 420 760">
  <title>Tarjeta de perfil y redes sociales editable</title>
  <desc>Tarjeta vectorial editable. Los textos, formas, colores e iconos son elementos SVG separados. Reemplaza las imágenes de portada y perfil usando los marcadores indicados.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f6fb"/><stop offset="1" stop-color="#e9edf5"/>
    </linearGradient>
    <linearGradient id="coverGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24285f"/><stop offset=".48" stop-color="#a54b83"/><stop offset="1" stop-color="#ff9d59"/>
    </linearGradient>
    <linearGradient id="avatarGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1678c9"/><stop offset="1" stop-color="#6336d9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#283b60" flood-opacity=".12"/>
    </filter>
    <clipPath id="coverClip"><rect x="34" y="32" width="352" height="190" rx="13"/></clipPath>
    <clipPath id="avatarClip"><circle cx="78" cy="275" r="31"/></clipPath>
  </defs>

  <!-- Fondo -->
  <rect id="page-background" width="420" height="760" fill="url(#background)"/>

  <!-- Cuerpo de la tarjeta -->
  <rect id="card" x="18" y="16" width="384" height="728" rx="24" fill="#ffffff" filter="url(#shadow)"/>

  <!-- PORTADA: reemplaza este grupo por una imagen si lo deseas -->
  <g id="cover-art" clip-path="url(#coverClip)">
    <rect x="34" y="32" width="352" height="190" fill="url(#coverGradient)"/>
    <circle cx="326" cy="116" r="18" fill="#ffd78a"/>
    <path d="M34 142 L81 104 L111 126 L157 73 L198 126 L226 107 L273 151 L315 123 L356 143 L386 111 L386 222 L34 222Z" fill="#34366f"/>
    <path d="M34 157 L81 123 L112 145 L157 95 L197 142 L228 126 L273 165 L315 141 L356 160 L386 132 L386 222 L34 222Z" fill="#202b5b"/>
    <path d="M34 169 L86 151 L124 164 L172 139 L219 169 L262 154 L305 178 L344 155 L386 169 L386 222 L34 222Z" fill="#121f43"/>
    <path d="M34 191 Q90 183 143 193 T246 191 T386 189 L386 222 L34 222Z" fill="#172044"/>
    <path d="M34 195 Q120 197 190 194 T386 195" fill="none" stroke="#ee8e9e" stroke-opacity=".7" stroke-width="1.5"/>
    <path d="M260 198 Q302 196 344 198" fill="none" stroke="#ffb46c" stroke-width="2"/>
    <text x="210" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" letter-spacing="2" fill="#ffffff" opacity=".85">PORTADA</text>
  </g>

  <!-- Identidad -->
  <g id="profile">
    <!-- Avatar editable; sustituye este círculo por una imagen recortada si quieres -->
    <circle id="avatar-background" cx="78" cy="275" r="33" fill="url(#avatarGradient)"/>
    <g id="avatar-placeholder" clip-path="url(#avatarClip)">
      <circle cx="78" cy="264" r="11" fill="#f3c3a4"/>
      <path d="M56 304 Q58 278 78 278 Q99 278 101 304Z" fill="#14213d"/>
      <path d="M65 264 Q61 247 78 246 Q94 247 94 263 L89 257 L83 254 L75 259 L68 258Z" fill="#20202b"/>
      <circle cx="74" cy="265" r="1.3" fill="#20202b"/><circle cx="83" cy="265" r="1.3" fill="#20202b"/>
      <path d="M74 272 Q79 275 84 271" fill="none" stroke="#a85c56" stroke-width="1.2" stroke-linecap="round"/>
    </g>
    <text id="name" x="126" y="267" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#111b33">Name</text>
    <text id="title" x="126" y="291" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" fill="#65728a">Título</text>
  </g>

  <!-- Redes sociales: cambia cada href="#" por la URL correspondiente -->
  <g id="social-links" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#17213a">
    <a id="apple-music-link" xlink:href="#" target="_blank">
      <rect x="42" y="330" width="30" height="30" rx="9" fill="#fa4265"/>
      <text x="57" y="351" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">♪</text>
      <text x="88" y="350">Apple Music</text>
    </a>
    <a id="spotify-link" xlink:href="#" target="_blank">
      <circle cx="57" cy="391" r="15" fill="#1ed760"/>
      <path d="M48 386 Q57 382 66 387 M49 391 Q57 388 64 392 M51 396 Q57 394 62 397" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <text x="88" y="396">Spotify</text>
    </a>
    <a id="youtube-link" xlink:href="#" target="_blank">
      <rect x="42" y="421" width="30" height="24" rx="7" fill="#ff1e1e"/>
      <path d="M54 427 L63 433 L54 439Z" fill="#ffffff"/>
      <text x="88" y="440">YouTube</text>
    </a>
    <a id="instagram-link" xlink:href="#" target="_blank">
      <rect x="42" y="465" width="30" height="30" rx="9" fill="#d946a4"/>
      <rect x="49" y="472" width="16" height="16" rx="5" fill="none" stroke="#ffffff" stroke-width="2.2"/>
      <circle cx="57" cy="480" r="4" fill="none" stroke="#ffffff" stroke-width="2"/>
      <circle cx="63" cy="474" r="1.4" fill="#ffffff"/>
      <text x="88" y="485">Instagram</text>
    </a>
    <a id="twitch-link" xlink:href="#" target="_blank">
      <rect x="42" y="510" width="30" height="30" rx="8" fill="#9146ff"/>
      <path d="M49 517 H65 V529 H60 L56 533 V529 H49Z" fill="none" stroke="#ffffff" stroke-width="2"/>
      <path d="M55 520 V526 M60 520 V526" stroke="#ffffff" stroke-width="2"/>
      <text x="88" y="530">Twitch</text>
    </a>
    <a id="x-link" xlink:href="#" target="_blank">
      <rect x="42" y="555" width="30" height="30" rx="8" fill="#111111"/>
      <path d="M49 563 L64 578 M63 563 L50 578 M58 563 L68 578 H63 L49 563 H54Z" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
      <text x="88" y="575">X</text>
    </a>
    <a id="soundcloud-link" xlink:href="#" target="_blank">
      <rect x="42" y="600" width="30" height="30" rx="8" fill="#ff5a1f"/>
      <path d="M48 619 V614 M52 619 V611 M56 619 V608 M60 619 V612 Q64 607 67 612 Q70 613 68 617 Q67 619 65 619Z" fill="#ffffff" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
      <text x="88" y="620">Sound Cloud</text>
    </a>
  </g>

  <!-- Nota de edición, ocultable/eliminable -->
  <g id="edit-note">
    <text x="210" y="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#9aa4b5">SVG EDITABLE · textos, formas, colores e iconos por separado</text>
  </g>
</svg>
