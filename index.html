<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Music Player</title>
    <meta
        name="description"
        content="Minimalist audio player with basic controls, focus on performance and responsive design. Clear and accessible interface.">
</head>
<body>
    <header class="header">
        <figure class="header__logo-container">
            <img
                class="header__isotype"
                src="assets/icons/wave-sound.png"
                alt="Isotipo de la marca">
            <figcaption class="header__logotype">Music Player</figcaption>
        </figure>
        <button
            class="header__button"
            aria-label="Mostrar lista de reproducción">
            <img class="header__playlist-icon"
                src="assets/icons/playlist.png"
                alt=""> <!-- 🤔 WHY: alternative is empty so that screen readers ignore it  -->
        </button>
    </header>
    <main class="main">
        <section
            class="main__player-container"
            aria-label="Reproductor de audio">
            <figure class="main__audio-figure">
                <img
                    class="main__audio-mask"
                    src="assets/images/ame.jpeg"
                    alt="Carátula del álbum Ame">
                    <figcaption class="main__album-name">Ame</figcaption>
            </figure>
            <figure>
                <audio
                    class="main__audio"
                    data-audio
                    preload="metadata"
                    src="assets/audios/everything-is-cold.mpeg">
                </audio>
                <figcaption>
                    <h1 class="main__audio-name">Everything is Cold</h1>
                </figcaption>
            </figure>
            <fieldset
                class="main__audio-controls"
                data-audio-controls>
                <legend class="main__control-description">
                    Controles de reproducción
                </legend>
                <button
                    class="main__audio-control"
                    data-action="repeat">
                    <img
                        class="main__control-icon"
                        src="assets/icons/repeat.png"
                        alt="Activar repetición">
                </button>
                <button
                    class="main__audio-control"
                    data-action="previous">
                    <img
                        class="main__control-icon"
                        src="assets/icons/back.png"
                        alt="Canción anterior">
                </button>
                <button
                    class="main__audio-control"
                    data-action="play">
                    <img
                        class="main__control-icon"
                        src="assets/icons/play.png"
                        alt="Reproducir">
                </button>
                <button
                    class="main__audio-control"
                    data-action="next">
                    <img
                        class="main__control-icon"
                        src="assets/icons/next.png"
                        alt="Canción siguiente">
                </button>
                <button
                    class="main__audio-control"
                    data-action="shuffle">
                    <img
                        class="main__control-icon"
                        src="assets/icons/shuffle.png"
                        alt="Activar modo aleatorio">
                </button>
            </fieldset>
        </section>
    </main>
</body>
</html>
