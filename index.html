<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="A web music player html template made by codewithsadee">
    <title>Music Player</title>
</head>
<body>
    <header class="header">
        <span class="header__icon material-symbols-rounded">
            graphic_eq
        </span>
        <h1 class="header__title">
            Music Player
        </h1>
        <button
            type="button"
            class="header__nav-button"
            aria-label="Abrir navbar"
            aria-controls="nav"
            aria-expanded="false">
            <span class="material-symbols-rounded">
                queue_music
            </span>
        </button>
    </header>
    <main class="main">
        <section class="player">
            <figure class="player__album">
                <img
                    class="player__album-image"
                    src="#"
                    alt="Happy Moments (Master) Album Poster">
            </figure>
            <div class="player__track-info">
                <h2 class="player__track-title">Happy Moments (Master)</h2>
                <div class="player__album-info">
                    <span class="player__album-name">No Spirit</span>
                    <span class="player__album-date">2022</span>
                </div>
                <span class="player__artist">No Spirit x Tonion</span>
            </div>
            <input
                type="range"
                aria-label="Progreso"
                class="player__progress-bar"
                min="0"
                max="100"
                value="0"
                name="progress">
            <div class="player__player-controls">
                <button type="button" class="player__control-button">
                    <span class="material-symbols-rounded">volume_up</span>
                </button>

                <button type="button" class="player__control-button">
                    <span class="material-symbols-rounded">repeat</span>
                    <span class="material-symbols-rounded">repeat_one</span>
                </button>

                <button type="button" class="player__control-button">
                    <span class="material-symbols-rounded">skip_previous</span>
                </button>

                <button type="button" class="player__control-button">
                    <span class="material-symbols-rounded">play_arrow</span>
                    <span class="material-symbols-rounded active-icon">pause</span>
                </button>

                <button type="button" class="player__control-button">
                    <span class="material-symbols-rounded">skip_next</span>
                </button>

                <button type="button" class="player__control-button">
                    <span class="material-symbols-rounded">shuffle</span>
                </button>
            </div>
            <input
                type="range"
                name="volume"
                aria-label="Volumen"
                min="0"
                max="100"
                value="100"
                class="player__volume">
        </section>
    </main>
    <nav class="nav" id="nav">
        <li><img src="assets/images/poster-1.jpg" alt="" class="nav__item"></li>
        <li><img src="assets/images/poster-2.jpg" alt="" class="nav__item"></li>
        <li><img src="assets/images/poster-3.jpg" alt="" class="nav__item"></li>
        <li><img src="assets/images/poster-4.jpg" alt="" class="nav__item"></li>
        <li><img src="assets/images/poster-5.jpg" alt="" class="nav__item"></li>
    </nav>
    <footer class="footer">Thanks to CodeWithSadee</footer>
</body>
</html>
